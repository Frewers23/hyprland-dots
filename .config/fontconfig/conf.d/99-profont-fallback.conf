<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <alias>
    <family>ProFontIIx Nerd Font</family>
    <prefer>
      <family>ProFontIIx Nerd Font</family>
      <family>Terminus</family>
      <family>CozetteVector</family>
    </prefer>
  </alias>
  <alias>
    <family>ProFont</family>
    <prefer>
      <family>ProFont</family>
      <family>Terminus</family>
      <family>CozetteVector</family>
    </prefer>
  </alias>
</fontconfig>
